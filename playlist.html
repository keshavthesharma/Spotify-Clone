<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg" alt="Spotify Logo" class="logo-img">
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>

    <main>
        <div class="playlist-header">
            <img src="https://images.unsplash.com/photo-1448387473223-5c37445527e7?auto=format&fit=crop&w=300&q=80" alt="Playlist Cover Image">
            <div>
                <p>Playlist</p>
                <h1 style="font-size: 4rem;">Chill Vibes</h1>
                <p>Kick back to the best new and recent chill tunes.</p>
                <a href="#" class="btn">Play</a>

                    <th>Artist</th>

                    <td>2</td>
                    <td>Weightless</td>
                    <td>Marconi Union</td>

                    <td>3</td>

                    <td>Massive Attack</td>
                    <td>5:30</td>

        <p>&copy; 2026 Spotify Clone - Web Dev Task</p>
