<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="border-bottom: 1px solid #282828;">
        <nav style="justify-content: flex-start;">
            <div class="logo">
                <a href="index.html">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg" alt="Spotify Logo" class="logo-img">
                </a>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-container" style="text-align: center;">
            <h2 style="margin-bottom: 30px;">Log in to Spotify</h2>
            <form action="#" method="POST" style="text-align: left;">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required placeholder="Email address">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Password">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Log In</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Spotify Clone - Web Dev Task</p>
    </footer>
</body>
</html>
